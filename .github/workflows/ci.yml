name: CI

on:
  push:
    paths:
      - .github/workflows/ci.yml
      - src/**
      - .gitignore
      - package-lock.json
      - package.json
      - tsconfig.json
  pull_request:
    paths:
      - .github/workflows/ci.yml
      - src/**
      - .gitignore
      - package-lock.json
      - package.json
      - tsconfig.json

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    timeout-minutes: 10


    steps:
      - uses: actions/checkout@v6 # v4

      - uses: actions/setup-node@v4 # v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install Dependencies
        run: npm install

      - name: Format
        run: npm run format

      - name: Lint
        run: npm run lint

      - name: Check
        run: npm run check
